<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#163d37">
  <meta name="description" content="在本地配置数字人服务、整理实拍素材，在本机工作台制作视频。">
  <title>叙影 · 视频工作台</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/controls.css">
  <link rel="stylesheet" href="/queue.css">
  <link rel="stylesheet" href="/acceptance.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/materials.css">
  <link rel="stylesheet" href="/publish.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#library" aria-label="叙影 首页"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span><span>叙影<small>实拍 · 成片</small></span></a>
      <a class="new-task-link" href="#create" data-nav="create"><span data-icon="plus"></span>新建制作</a>
      <nav aria-label="主要导航">
        <a href="#library" data-nav="library" aria-label="机构资料库" title="机构资料库"><span data-icon="folder"></span><span>机构资料库</span></a>
        <a href="#tasks" data-nav="tasks" aria-label="制作任务" title="制作任务"><span data-icon="clapper"></span><span>制作任务</span><span class="nav-count" id="task-count">0</span></a>
        <a href="#works" data-nav="works" aria-label="成品库" title="成品库"><span data-icon="grid"></span><span>成品库</span><span class="nav-count" id="works-count">0</span></a>
        <a href="#publish" data-nav="publish" aria-label="发布任务" title="发布任务"><span data-icon="send"></span><span>发布任务</span><span class="nav-count" id="publish-count">0</span></a>
        <a href="#people" data-nav="people" aria-label="数字人" title="数字人"><span data-icon="person"></span><span>数字人</span></a>
        <a href="#styles" data-nav="styles" aria-label="风格库" title="风格库"><span data-icon="palette"></span><span>风格库</span></a>
        <a href="#settings" data-nav="settings" aria-label="设置" title="设置"><span data-icon="settings"></span><span>设置</span><span class="nav-dot" id="setup-dot" hidden></span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-note"><span class="status-dot"></span><span>在你的电脑上运行</span></div>
        <p>素材、配置与作品<br>都留在本地项目中。</p>
        <button class="sidebar-help" data-action="onboarding"><span data-icon="help"></span>首次使用指南<span data-icon="arrow-up-right"></span></button>
        <div class="version">养老混剪 <span id="skill-version">…</span></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">我的工作空间<span>/</span><strong id="page-label">机构资料库</strong></div><div class="topbar-actions"><button class="connection-status" data-action="agent-settings"><span class="status-dot muted" id="agent-dot"></span><span id="agent-status">正在读取本地配置</span><span data-icon="chevron-right"></span></button><a class="mobile-new" href="#create" aria-label="新建制作"><span data-icon="plus"></span>新建</a></div></header>
      <main id="main" tabindex="-1"><div class="initial-state"><div class="skeleton-line"></div><div class="skeleton-block"></div><p>正在打开你的工作台…</p></div></main>
      <footer class="workspace-footer"><span>让每一份实拍，都有值得被看见的故事。</span><span>本地工作台 · <span id="footer-version">0.6</span></span></footer>
    </div>
  </div>
  <section id="workbench-exited" class="loading-error" hidden>
    <h2 tabindex="-1">工作台已退出</h2>
    <p>可以关闭此页面。下次使用时，双击项目启动器。</p>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="folder-upload" webkitdirectory multiple hidden>
  <input type="file" id="files-upload" multiple accept="video/*,image/*,.txt,.md,.docx,.pdf" hidden>
  <input type="file" id="music-upload" multiple accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.opus" hidden>
  <script src="/app.js" defer></script>
  <script src="/library.js" defer></script>
  <script src="/video.js" defer></script>
  <script src="/music.js" defer></script>
  <script src="/controls.js" defer></script>
  <script src="/queue.js" defer></script>
  <script src="/styles.js" defer></script>
  <script src="/materials.js" defer></script>
  <script src="/publish.js" defer></script>
  <script src="/pagination.js" defer></script>
  <script src="/acceptance.js" defer></script>
</body>
</html>
