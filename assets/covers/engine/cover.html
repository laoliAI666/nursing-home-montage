<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>更换封面</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4ee;color:#103f42;font:15px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}main{max-width:1280px;margin:auto;padding:30px;display:grid;grid-template-columns:minmax(300px,460px) 1fr;gap:42px}.preview{position:sticky;top:24px;align-self:start}canvas{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 10px 35px #003f461c}.eyebrow{font-size:12px;color:#60817a}h1{font-size:29px;margin:6px 0 10px}h2{font-size:17px;margin:25px 0 8px}p{color:#5c746d}label{display:block;font-size:13px;margin:12px 0}input,textarea{display:block;width:100%;border:1px solid #cbd8ce;border-radius:7px;padding:10px 12px;background:#fff;font:inherit;color:#123f42;margin-top:5px}textarea{resize:vertical;min-height:90px}.card{padding:13px 16px;background:#fff;border:1px solid #d9e4d9;border-radius:8px}.tags{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photos{display:grid;gap:10px}.photos label{margin:0;padding:12px;background:#fff;border-radius:7px;border:1px solid #d9e4d9}.photos input{font-size:12px;border:0;padding:0}.button{display:inline-block;background:#087f85;color:#fff;border:0;border-radius:7px;padding:12px 22px;font:700 15px inherit;text-decoration:none;cursor:pointer}.button:disabled{opacity:.45;cursor:not-allowed}#status{white-space:pre-line;font-size:12px;color:#56796b}#status.error{color:#a54536}.small{font-size:12px}.footer{border-top:1px solid #d7e1d5;padding-top:15px}dialog{border:0;border-radius:12px;max-width:470px;width:95%;max-height:90vh;padding:20px}dialog::backdrop{background:#002f4299}dialog img{max-width:100%;max-height:65vh;display:block;margin:0 auto 15px}.close{float:right;background:none;border:0;font-size:22px;cursor:pointer}@media(max-width:760px){main{padding:18px;grid-template-columns:1fr;gap:24px}.preview{position:static;max-width:390px;margin:auto}.tags{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body><main><section class="preview"><canvas id="cover" width="1080" height="1920" aria-label="封面预览"></canvas><p class="small">1080 × 1920 · 本地代码排版 · 可离线使用</p></section><section><div class="eyebrow" id="style-eyebrow">风格库封面 / 更换封面</div><h1>修改文字，替换实地图。</h1><p>人物和署名随身份固定。调整后导出新的封面 PNG；包内 MP4 不会自动改动，需将新图用于视频封面或交给制作流程替换首帧。</p><div class="card" id="identity"></div>
<h2>主标题</h2><label>两行展示，支持自动断行<textarea id="title"></textarea></label><label>高亮词，多个用顿号分隔<input id="highlights"></label><div class="tags"><label>标签一<input id="label0"></label><label>标签二<input id="label1"></label><label>标签三<input id="label2"></label></div><label>机构完整名称<input id="institution"></label>
<h2>实地图片</h2><p class="small">优先选择与标签对应的同机构图片。替换图片仅在当前页面生效，不上传。</p><div class="photos"><label>图片一<input id="photo0" type="file" accept="image/*"></label><label>图片二<input id="photo1" type="file" accept="image/*"></label><label>图片三<input id="photo2" type="file" accept="image/*"></label></div>
<p id="status" role="status">正在加载字体和图片…</p><button id="export" class="button" disabled>导出封面 PNG</button><p class="small footer">固定头标：<span id="header"></span>。三枚标签始终同字号；完整院名不省略，文字不拉伸。</p></section></main><dialog id="result"><button class="close" id="close" aria-label="关闭">×</button><img id="export-image" alt="新封面"><a id="save" class="button" download="新封面.png">保存 PNG</a></dialog><script id="cover-data" type="application/json">__DATA__</script><script>
__LAYOUT__
const input=JSON.parse(document.getElementById('cover-data').textContent),el=id=>document.getElementById(id);
if(input.styleName)el('style-eyebrow').textContent=`${input.styleName} / 更换封面`;
el('title').value=input.title;el('highlights').value=input.highlights.join('、');el('institution').value=input.institution_name;el('header').textContent=input.header_text;el('identity').textContent=`数字人：${input.identity.person_name}　／　绑定署名：${input.identity.social_media_name}`;input.labels.forEach((v,i)=>el('label'+i).value=v);
function status(r){el('status').textContent=r.errors.length?r.errors.join('\n'):`排版通过 · 主标题 ${r.title.em}px · 三标签统一 ${r.tags.em}px · 完整院名 ${r.brand.em}px`;el('status').classList.toggle('error',!!r.errors.length);el('export').disabled=!!r.errors.length;}
mountCover(el('cover'),input,status).then(async app=>{if(input.provided_cover){await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{el('cover').getContext('2d').drawImage(im,0,0,1080,1920);resolve();};im.onerror=reject;im.src=input.provided_cover;});const png=app.png;let edited=false;const set=app.set,photo=app.replacePhoto;app.set=p=>{edited=true;return set(p);};app.replacePhoto=(i,u)=>{edited=true;return photo(i,u);};app.png=()=>edited?png():el('cover').toDataURL('image/png');}window.coverApp=app;for(const id of ['title','highlights','institution','label0','label1','label2'])el(id).addEventListener('input',()=>app.set({title:el('title').value,highlights:el('highlights').value,brand:el('institution').value,tags:[0,1,2].map(i=>el('label'+i).value)}));
for(let i=0;i<3;i++)el('photo'+i).addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>app.replacePhoto(i,reader.result).catch(err=>{el('status').textContent=err.message;});reader.readAsDataURL(f);});
el('export').onclick=()=>{const png=app.png();el('export-image').src=png;el('save').href=png;el('save').download=(input.filename||'新封面')+'_封面.png';el('result').showModal();};el('close').onclick=()=>el('result').close();
}).catch(e=>{el('status').textContent='加载失败：'+e.message;el('status').classList.add('error');console.error(e);});
</script></body></html>
